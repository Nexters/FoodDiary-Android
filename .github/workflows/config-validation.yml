name: Config Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-config:
    name: Validate required configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create CI local.properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -z "$LOCAL_PROPERTIES" ]; then
            echo "::error::LOCAL_PROPERTIES is missing or blank"
            exit 1
          fi

          umask 077
          printf '%s\n' "$LOCAL_PROPERTIES" > local.properties

      - name: Validate configuration
        run: ./gradlew validateRequiredProperties

      - name: Remove CI local.properties
        if: always()
        run: rm -f local.properties
